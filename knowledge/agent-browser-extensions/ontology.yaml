# Ontology for agent-browser-extensions (approved by owner 2026-11-16T15:17:19+07:00).
# Documents cite claims; claims rest on sources; sources point at frozen captures.
version: "1"
interfaces:
  sourced-document:
    properties: [title, description, when, source_attribution]
    sections: ["## Purpose", "## When to Use / When NOT", "## Core Knowledge Content", "## Failure Modes (Mandatory)"]
    rules: [anchors-match-cited-claims]
  evidence-claim:
    properties: [title, statement, claim_type, confidence, atom_ids, evidence]
    sections: ["## Statement", "## Evidence"]
  frozen-source:
    properties: [title, url, kind, publisher, captures]
    sections: ["## Capture"]
object_types:
  concept:
    implements: [sourced-document]
    properties:
      - {name: domain, type: string}
  guide:
    implements: [sourced-document]
    properties:
      - {name: domain, type: string}
  comparison:
    implements: [sourced-document]
    properties:
      - {name: domain, type: string}
  decision-record:
    implements: [sourced-document]
    properties:
      - {name: domain, type: string}
  claim:
    implements: [evidence-claim]
    folder: claims
    properties:
      - {name: claim_type, type: enum, values: [FACT, FAILURE_MODE, BENCHMARK, CONTRADICTION, INFERENCE]}
      - {name: confidence, type: enum, values: [HIGH, MEDIUM, LOW]}
      - {name: resolution, type: string}
  source:
    implements: [frozen-source]
    folder: sources
    properties:
      - {name: kind, type: enum, values: [official, academic, vendor, practitioner, community, first-party]}
  entity:
    folder: entities
  browser-engine:
    folder: entities
    properties:
      - {name: family, type: enum, values: [chromium, gecko, webkit]}
  bridge-primitive:
    folder: entities
    properties:
      - {name: layer, type: enum, values: [transport, execution-world, input-dispatch, lifecycle, safety-fencing]}
      - {name: portability, type: enum, values: [universal, chromium-only, polyfillable, host-assisted]}
  interaction-barrier:
    folder: entities
    properties:
      - {name: category, type: enum, values: [platform-isolation, lifecycle-limit, cross-engine-gap, human-only-gate]}
link_types:
  - {link_type: cites, from: sourced-document, to: claim, cardinality: many-to-many}
  - {link_type: supported-by, from: claim, to: source, cardinality: many-to-many}
  - {link_type: contradicts, from: claim, to: claim, cardinality: many-to-many}
  - {link_type: compares, from: sourced-document, to: [sourced-document, browser-engine, bridge-primitive], cardinality: many-to-many}
  - {link_type: depends-on, from: sourced-document, to: sourced-document, cardinality: many-to-many}
  - {link_type: about, from: [sourced-document, claim], to: [entity, browser-engine, bridge-primitive, interaction-barrier], cardinality: many-to-many}
  - {link_type: overcomes, from: bridge-primitive, to: interaction-barrier, cardinality: many-to-many}
extra_keys: []
